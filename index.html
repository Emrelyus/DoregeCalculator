<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ege Karabek Hesap Makinesi</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            flex-direction: column;
        }

        h1 {
            margin-top: 40px;
            margin-bottom: 20px;
            color: #34c759;
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(52, 199, 89, 0.3);
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .calculator {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 360px;
        }

        #display {
            width: 100%;
            height: 60px;
            font-size: 2rem;
            text-align: right;
            margin-bottom: 20px;
            padding: 10px;
            box-sizing: border-box;
            border: none;
            background: transparent;
            color: #ffffff;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .trig {
            background-color: #5856d6;
            font-size: 0.9rem;
        }

        .trig:hover {
            background-color: #6e6cf0;
        }

        button {
            height: 60px;
            border-radius: 15px;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #333;
            color: white;
        }

        button:hover {
            background-color: #444;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background-color: #ff9500;
            color: white;
        }

        .operator:hover {
            background-color: #ffaa33;
        }

        .clear {
            background-color: #ff3b30;
        }

        .equal {
            background-color: #34c759;
            grid-column: span 3;
        }

        .visualizer {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 500px;
            height: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #fractionCanvas {
            margin-top: 20px;
            background-color: #252525;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Ege Karabek Hesap Makinesi</h1>
    <div class="container">
        <div class="calculator">
            <input type="text" id="display" disabled placeholder="0">
            <div class="buttons">
                <!-- Satır 1: Fonksiyonlar -->
                <button class="trig" onclick="appendToDisplay('sin(')">sin</button>
                <button class="trig" onclick="appendToDisplay('cos(')">cos</button>
                <button class="trig" onclick="appendToDisplay('tan(')">tan</button>
                <button onclick="appendToDisplay('(')">(</button>
                <button onclick="appendToDisplay(')')">)</button>

                <!-- Satır 2 -->
                <button onclick="appendToDisplay('7')">7</button>
                <button onclick="appendToDisplay('8')">8</button>
                <button onclick="appendToDisplay('9')">9</button>
                <button class="operator" onclick="appendToDisplay('/')">/</button>
                <button class="clear" onclick="clearDisplay()">C</button>

                <!-- Satır 3 -->
                <button onclick="appendToDisplay('4')">4</button>
                <button onclick="appendToDisplay('5')">5</button>
                <button onclick="appendToDisplay('6')">6</button>
                <button class="operator" onclick="appendToDisplay('*')">×</button>
                <button onclick="deleteLast()">DEL</button>

                <!-- Satır 4 -->
                <button onclick="appendToDisplay('1')">1</button>
                <button onclick="appendToDisplay('2')">2</button>
                <button onclick="appendToDisplay('3')">3</button>
                <button class="operator" onclick="appendToDisplay('-')">-</button>
                <button class="operator" onclick="appendToDisplay('+')">+</button>

                <!-- Satır 5: Alt Kısım -->
                <button onclick="appendToDisplay('0')">0</button>
                <button onclick="appendToDisplay('.')">.</button>
                <button class="equal" onclick="calculate()">=</button>
            </div>
        </div>

        <div class="visualizer" id="visualizer">
            <h3 id="visualizerTitle">Görselleştirici</h3>
            <span id="visualizerInfo">İşlem yapın...</span>
            <canvas id="fractionCanvas" width="440" height="440"></canvas>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const canvas = document.getElementById('fractionCanvas');
        const ctx = canvas.getContext('2d');
        const visualizerTitle = document.getElementById('visualizerTitle');
        const visualizerInfo = document.getElementById('visualizerInfo');

        function appendToDisplay(input) {
            display.value += input;
            updateVisualizer();
        }

        function clearDisplay() {
            display.value = "";
            updateVisualizer();
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
            updateVisualizer();
        }

        function calculate() {
            try {
                let expression = display.value;

                // Sin 90, sin(90), cos 45 vb. tüm yapıları yakala
                expression = expression.replace(/(sin|cos|tan)\s*\(?(-?\d*\.?\d+)\)?/g, (match, func, angle) => {
                    return `Math.${func}((Math.PI/180)*${angle})`;
                });

                const result = eval(expression);

                // Hassasiyet düzeltmesi (özellikle cos 90 = 0 olması için)
                let finalResult = parseFloat(result.toFixed(10));
                if (Math.abs(finalResult) < 1e-10) finalResult = 0;

                display.value = finalResult;
                updateVisualizer();
            } catch (error) {
                display.value = "Hata";
                setTimeout(clearDisplay, 1500);
            }
        }

        function updateVisualizer() {
            const val = display.value;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Kesir Kontrolü
            const fractionRegex = /^(\d+)\/(\d+)$/;
            const fractionMatch = val.match(fractionRegex);

            // Trigonometri Kontrolü (sin 45 veya sin(45) formatı)
            const trigRegex = /^(sin|cos|tan)\s*\(?(-?\d*\.?\d*)\)?$/;
            const trigMatch = val.match(trigRegex);

            if (fractionMatch) {
                const numerator = parseInt(fractionMatch[1]);
                const denominator = parseInt(fractionMatch[2]);
                visualizerTitle.innerText = "Kesir Görselleştirici";

                if (denominator === 0) {
                    visualizerInfo.innerText = "Sıfıra bölünemez!";
                    return;
                }

                visualizerInfo.innerText = `${numerator} / ${denominator}`;
                drawPie(numerator, denominator);
            } else if (trigMatch) {
                const func = trigMatch[1];
                const angle = parseFloat(trigMatch[2]) || 0;
                visualizerTitle.innerText = "Trigonometri Grafiği";
                visualizerInfo.innerText = `${func}(${angle}°)`;
                drawGraph(func, angle);
            } else {
                visualizerTitle.innerText = "Görselleştirici";
                visualizerInfo.innerText = "Kesir (3/4) veya Trig (sin(45)) yazın";
            }
        }

        function drawGraph(func, angle) {
            const width = canvas.width;
            const height = canvas.height;
            const centerY = height / 2;
            const centerX = width / 2;
            const scale = 60; // 1 birim kaç piksel (büyütüldü)

            // Eksenler
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(width, centerY);
            ctx.moveTo(centerX, centerY - 100);
            ctx.lineTo(centerX, centerY + 100);
            ctx.stroke();

            // Grafik Çizimi
            ctx.strokeStyle = "#34c759";
            ctx.lineWidth = 2;
            ctx.beginPath();

            for (let x = -centerX; x < centerX; x++) {
                const currentAngle = (x / scale) * (180 / Math.PI); // Pikselden dereceye
                let y;
                if (func === 'sin') y = Math.sin(x / scale);
                else if (func === 'cos') y = Math.cos(x / scale);
                else if (func === 'tan') y = Math.tan(x / scale);

                const canvasX = centerX + x;
                const canvasY = centerY - y * scale;

                if (x === -centerX) ctx.moveTo(canvasX, canvasY);
                else {
                    // Tan için sıçramaları engelle
                    if (func === 'tan' && Math.abs(y) > 5) ctx.moveTo(canvasX, canvasY);
                    else ctx.lineTo(canvasX, canvasY);
                }
            }
            ctx.stroke();

            // Aktif Noktayı İşaretle
            const targetX = (angle * Math.PI / 180) * scale;
            let targetY;
            if (func === 'sin') targetY = Math.sin(angle * Math.PI / 180);
            else if (func === 'cos') targetY = Math.cos(angle * Math.PI / 180);
            else if (func === 'tan') targetY = Math.tan(angle * Math.PI / 180);

            const px = centerX + targetX;
            const py = centerY - targetY * scale;

            if (px >= 0 && px <= width) {
                ctx.fillStyle = "#ff3b30";
                ctx.beginPath();
                ctx.arc(px, py, 5, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        function drawPie(num, den) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 180; // Yarıçap büyütüldü

            // Arkaplan dairesi (tam)
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.fillStyle = "#444";
            ctx.fill();
            ctx.stroke();

            if (den > 0) {
                const sliceAngle = (2 * Math.PI) / den;

                // Dilimleri boya ve numaralandır
                for (let i = 0; i < den; i++) {
                    const startAngle = i * sliceAngle - Math.PI / 2;
                    const endAngle = (i + 1) * sliceAngle - Math.PI / 2;
                    const middleAngle = startAngle + sliceAngle / 2;

                    // Dilimi boya (sadece pay kadar)
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                    ctx.closePath();

                    if (i < num) {
                        ctx.fillStyle = "#34c759";
                        ctx.fill();
                    }

                    ctx.strokeStyle = "#1e1e1e";
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Rakamı yaz
                    const labelRadius = radius * 0.65;
                    const lx = centerX + labelRadius * Math.cos(middleAngle);
                    const ly = centerY + labelRadius * Math.sin(middleAngle);

                    ctx.fillStyle = "white";
                    ctx.font = "bold 18px Segoe UI";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(i + 1, lx, ly);
                }

                // Orta çizgileri çek (netlik için tekrar)
                for (let i = 0; i < den; i++) {
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    const x = centerX + radius * Math.cos(i * sliceAngle - Math.PI / 2);
                    const y = centerY + radius * Math.sin(i * sliceAngle - Math.PI / 2);
                    ctx.lineTo(x, y);
                    ctx.strokeStyle = "#121212";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        // İlk yüklemede temizle
        updateVisualizer();
    </script>

</body>

</html>
